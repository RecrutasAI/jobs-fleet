[project]
name = "jobs-fleet"
version = "0.0.1"
description = "Open, daily-updated dataset of US jobs read directly from company career pages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ats-scrapers[scrapers,parquet]>=0.1",
    "huggingface_hub>=0.24",
]

[tool.setuptools]
packages = ["fleet"]
