[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-fleet"
version = "0.0.1"
description = "Open, daily-updated dataset of US jobs read directly from company career pages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Pinned: a library upgrade is a reviewed change with a canary run (ADR 0001).
    "ats-scrapers[scrapers,parquet]==0.3.0",
    "huggingface_hub>=0.24,<3",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["fleet"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
